[project]
name = "wax-ot"
version = "0.2.1"
description = "WaX: explainable Wasserstein distances. Attributes a Wasserstein distance to instances, features and subspaces (Naumann, Kauffmann and Montavon, TPAMI 2026)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Omar A. Hassan", email = "quickyomar@gmail.com" }]
keywords = [
    "optimal-transport",
    "wasserstein",
    "explainable-ai",
    "layer-wise-relevance-propagation",
    "dataset-shift",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# The attribution rules are pure numpy and scipy. Everything heavier is an
# extra, so that `pip install wax-ot` does not pull a deep learning stack in
# order to evaluate a closed-form expression.
dependencies = [
    "numpy>=2.2.6",
    "pot>=0.9.7.post1",
    "scipy>=1.15.3",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.10.9"]
torch = ["torch>=2.13.0"]
repro = [
    "wax-ot[viz,torch]",
    "scikit-learn>=1.7.2",
    "open-clip-torch>=3.3.0",
]

[project.urls]
Homepage = "https://github.com/omar-A-hassan/wax-ot"
Issues = "https://github.com/omar-A-hassan/wax-ot/issues"
Paper = "https://arxiv.org/abs/2505.06123"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wax"]

[tool.hatch.build.targets.sdist]
include = ["src/wax", "tests", "scripts", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
