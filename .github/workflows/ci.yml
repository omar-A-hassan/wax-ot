name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Core install only: numpy, scipy and POT. The tests that need torch or
  # scikit-learn skip themselves, which is what keeps this job fast and proves
  # the package really does work without the heavy extras.
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run ruff check
      - run: uv run pytest -q

  # Everything installed, so nothing skips. This is the job that runs the
  # comparison against the authors' reference implementation.
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run pytest -q
