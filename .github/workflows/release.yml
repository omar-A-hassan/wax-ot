name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI Trusted Publishing exchanges this short-lived OIDC token for an
      # upload token, so there is no long-lived API key stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      # A version on PyPI is permanent. If the tag and the version in
      # pyproject.toml disagree, stop here instead of publishing the wrong one.
      - name: Check that the tag matches the project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project="$(uv run python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "tag=$tag project=$project"
          if [ "$tag" != "$project" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match project version $project"
            exit 1
          fi

      - run: uv sync --all-extras
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish --trusted-publishing always
