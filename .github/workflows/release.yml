name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI Trusted Publishing exchanges this short-lived OIDC token for an
      # upload token, so there is no long-lived API key stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - run: uv run pytest -q
      - run: uv build
      - run: uv publish --trusted-publishing always
