name: reproduce

# The experiment scripts fetch datasets from the UCI repository, and those URLs
# have already moved once: every loader in this project was silently returning
# 404 before it was caught by hand. This job exists to catch that rot early. It
# never runs on a pull request, and it never touches the 1.3 GB CelebA archive.
on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras
      - name: Table I on the two small datasets
        run: uv run python scripts/01_faithfulness_srg.py --datasets wisconsin musk1 --reps 1
      - name: Table III without the 260 MB Electricity archive
        run: uv run python scripts/02_characterize_shift.py --datasets air-quality appliances
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/
